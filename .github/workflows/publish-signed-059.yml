name: Publish verified signed0.5.9
on:
  push:
    branches: [feature/cloud-framing-response]
    paths: [.github/workflows/publish-signed-059.yml]
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      APK_SHA256: e64dc0f67e0c5323e44adff9bd253dce94d112ed21d66731d136f927da6e8eac
      CERT_SHA256: 0a8f4734e62f984c94bd38d63a0ac15dd06cf9bfb5041175f51fb3ae114ceaab
      APP_SHA: cfdf79642e01580d6310438af4020639a3f1aa61
    steps:
      - name: Verify original signature and publish exact APK
        shell: bash
        run: |
          set -euo pipefail
          gh api repos/$GH_REPO/git/blobs/1dbf629115480898c934199105a54e3b10742fa3 --jq .content | base64 --decode > qingyang-0.5.9.apk
          echo "$APK_SHA256  qingyang-0.5.9.apk" | sha256sum --check
          signer=$(find "$ANDROID_HOME/build-tools" -name apksigner -type f | sort -V | tail -1)
          "$signer" verify --verbose --print-certs qingyang-0.5.9.apk | tee signature.txt
          grep -F "certificate SHA-256 digest: $CERT_SHA256" signature.txt
          cat > notes.md <<'NOTES'
          0.5.9/18 原密钥候选。修正浅色旧轮廓与胸部附着运动场，保留Q弹；加入S2校准相机、独立纸面拓扑、接触映射和实际深度遮挡。
          当前S2仍进行中，连续侧背纹理尚未完成，生产视角保持有界。真机锁屏、主观自然度与耗电待验。
          SHA256: e64dc0f67e0c5323e44adff9bd253dce94d112ed21d66731d136f927da6e8eac
          NOTES
          if gh release view v0.5.9 >/dev/null 2>&1; then
            mkdir existing
            gh release download v0.5.9 --pattern qingyang-0.5.9.apk --dir existing
            echo "$APK_SHA256  existing/qingyang-0.5.9.apk" | sha256sum --check
          else
            gh release create v0.5.9 qingyang-0.5.9.apk --target "$APP_SHA" --title "轻漾0.5.9 · 轮廓修正与S2空间遮挡候选" --prerelease --notes-file notes.md
          fi
          curl --fail --location --retry 3 "https://github.com/$GH_REPO/releases/download/v0.5.9/qingyang-0.5.9.apk" --output anonymous-download.apk
          echo "$APK_SHA256  anonymous-download.apk" | sha256sum --check
          echo ANONYMOUS_RELEASE_DOWNLOAD_SHA256_OK

