<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>轻漾 · 人物2.5D样片</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111211;color:#e4dfd4;font:15px system-ui,'Microsoft YaHei',sans-serif;display:flex;min-height:100svh;align-items:center;justify-content:center;gap:38px;padding:24px}main{height:min(92svh,900px);aspect-ratio:9/20;position:relative;overflow:hidden;border-radius:18px;background:#24221e;box-shadow:0 20px 80px #0008;touch-action:none}canvas{display:block;width:100%;height:100%}.clock{position:absolute;top:6%;left:0;right:0;text-align:center;color:#fff9;pointer-events:none;text-shadow:0 1px 10px #0005}.clock strong{display:block;font-size:clamp(28px,4vw,50px);font-weight:300;letter-spacing:3px}.clock span{font-size:12px}aside{max-width:300px}h1{font-size:24px;font-weight:500;margin:0 0 12px}p{line-height:1.8;color:#a9a89f;font-size:14px;margin:10px 0}.tag{font-size:11px;color:#b2bda8;letter-spacing:2px;margin-bottom:16px}button{color:#e8e5d9;background:#34392f;border:1px solid #53604b;border-radius:8px;padding:11px 18px;font:inherit;cursor:pointer;margin:14px 8px 10px 0}label{display:block;margin:12px 0;color:#c5cbbd}select{margin-left:8px;background:#2b3128;color:#e8e5d9;padding:8px;border:1px solid #53604b;border-radius:6px}button:hover{background:#46523f}#phase{color:#dae3c8;min-height:42px;margin-top:16px}#stats{font:11px ui-monospace,monospace;color:#777d71;white-space:pre-line}.foot{font-size:12px;border-top:1px solid #34352e;padding-top:16px}.error{color:#ffbfb1!important}@media(max-width:800px){body{padding:0;display:block}main{height:82svh;border-radius:0;margin:auto;max-width:100vw}aside{padding:18px 24px;max-width:600px;margin:auto}h1{font-size:20px}.clock strong{font-size:38px}p{margin:5px 0}}
</style></head><body>
<main id="stage"><canvas id="scene" aria-label="原图人物网格变形预览"></canvas><div class="clock"><span>锁屏构图参考</span><strong>10:24</strong></div></main>
<aside><div class="tag">轻漾 / 自定义 2.5D 样片</div><h1>人物转向与回弹预览</h1><p>缓慢移动指针看小幅转向；快速来回移动后停下，看身体、胸部与头发的惯性逐渐稳定。</p><label>构图 <select id="composition"><option value="wide">舒展肩背</option><option value="close">原近景</option></select></label><label>回弹 <select id="response"><option value="elastic">增强 Q 弹</option><option value="legacy">0.5.1 对照</option></select></label><button id="gyro">只转动测试</button><button id="demo">播放动作演示</button><button id="reset">回到正中</button><div id="phase" aria-live="polite">正在加载素材…</div><div id="stats"></div><p class="foot">桌面预览。原图网格＋背景补绘；使用与安卓同源着色器和同参数物理；此处为合成输入演示，真机仍需验收。大侧面与背面不在本样片范围内。</p></aside>
