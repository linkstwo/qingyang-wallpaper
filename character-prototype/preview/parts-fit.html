<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻漾 · 部件调整</title><style>
*{box-sizing:border-box}body{margin:0;background:#111916;color:#edf1e6;font:15px system-ui,'Microsoft YaHei',sans-serif}header,main{max-width:1200px;margin:auto;padding:22px}header{display:flex;align-items:end;justify-content:space-between;gap:20px}h1{font-size:26px;margin:5px 0 9px;font-weight:600}.eyebrow{color:#a6c5af;font-size:12px;letter-spacing:2px}p{color:#b8c8bb;line-height:1.65;margin:8px 0}.tools{display:flex;align-items:center;flex-wrap:wrap;gap:10px;background:#1e2a23;padding:15px;border-radius:12px}label{display:flex;gap:8px;align-items:center}button,select{font:inherit;color:#edf1e6;border:1px solid #516b59;background:#2a4032;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{background:#395741}button:disabled{opacity:.4;cursor:wait}.panels{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}figure{margin:0;background:#1b2820;border:1px solid #354b3b;border-radius:12px;overflow:hidden}figcaption{padding:12px 16px;display:flex;justify-content:space-between;font-size:14px}figcaption span{color:#a6b9a8;font-size:12px}canvas{display:block;width:100%;height:auto;touch-action:none;cursor:crosshair;background:#18231d}.actions{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.primary{background:#8bc79b;color:#102016;border-color:#8bc79b}.status{min-height:28px;color:#d5e7d7;margin:14px 0}.note{font-size:13px;max-width:850px}.error{color:#ffb9a9}a{color:#bce0c5}input[type=range]{accent-color:#9ccea7;width:120px}details{margin-top:20px;color:#9fb2a4}pre{max-height:170px;overflow:auto;font-size:11px;white-space:pre-wrap}#file{display:none}@media(max-width:700px){header{display:block;padding-bottom:0}main{padding:14px}.panels{gap:10px}figcaption{display:block;padding:10px;font-size:12px}figcaption span{display:block;margin-top:4px}.tools{padding:12px}h1{font-size:23px}.actions button{padding:9px;font-size:13px}}
</style></head><body><header><div><div class="eyebrow">轻漾 / 素材工作台</div><h1>拖动几个点，调整一个部件</h1><p>左边确定控制点的位置，右边拖动调整。局部以外保持原图。</p></div><a href="structural-lab.html">结构工作台 ↗</a></header><main>
<section class="tools" aria-label="部件设置"><label>素材 <select id="source"><option value="main">当前阅读图</option><option value="side">侧面参考</option><option value="back">背面参考</option><option value="sideB">同朝向侧背裁片（新候选）</option><option value="sideBNape">同图：颈肩局部</option><option value="sideBUpperArm">同图：屈臂局部（姿态不同）</option><option value="sideBNapeCutout">颈肩：去背景保守裁片</option><option value="sideBUpperArmCutout">上臂：去背景保守裁片</option></select></label><label>部件 <select id="part"><option value="arm">手臂局部</option><option value="shoulder">肩部局部</option><option value="torso">躯干局部</option></select></label><label>效果 <input id="gain" aria-label="调整强度" type="range" min="0" max="100" value="100"><output id="gainText">100%</output></label><label><input type="checkbox" id="mesh"> 显示网格</label></section>
<div class="panels"><figure><figcaption>原图<span>拖动编号点，选择作用位置</span></figcaption><canvas id="before" aria-label="原图与控制点"></canvas></figure><figure><figcaption>调整结果<span>拖动编号点，改变部件形状</span></figcaption><canvas id="after" aria-label="部件变形结果"></canvas></figure></div>
<section class="actions"><button id="demo">试一次小幅调整</button><button id="compare">按住看原图</button><button id="reset">重置此部件</button><button id="save" class="primary">保存草稿</button><button id="restore">恢复草稿</button><button id="export">导出配准数据</button><button id="import">导入数据</button><input id="file" type="file" accept="application/json,.json"></section>
<p id="status" class="status" role="status">正在读取本地素材…</p><p class="note">用于素材制作的局部形变。当前预览保留选区内的背景；输出用于进一步配准，尚未接入手机壁纸，也不会补出被遮住的侧背。切换部件或素材会放弃未保存调整，请先保存草稿。</p>
<p><a href="component-fit.html">颈肩与上臂共边调整</a> · 同一供图共享控制点，保留连接。</p><details><summary>数据与来源</summary><p class="note">浮点 MLS 相似变形；参考 <a href="https://github.com/Jarvis73/Moving-Least-Squares" target="_blank" rel="noreferrer">开源实现</a>，本页不加载任何外部脚本或模型。原图只读；草稿绑定原图哈希。</p><pre id="data"></pre></details>
</main><script type="module" src="parts-fit.mjs"></script></body></html>
