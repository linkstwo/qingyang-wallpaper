<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>轻漾 · 结构与局部材料工作台</title>
<style>
:root{font:14px/1.6 system-ui,sans-serif;color:#e3e9f4;background:#0d121b;color-scheme:dark}*{box-sizing:border-box}body{margin:0}header{padding:20px 28px;border-bottom:1px solid #293344;display:flex;align-items:center;gap:18px}h1{font-size:20px;margin:0}header span{color:#f2bb75;font-size:12px}main{display:grid;grid-template-columns:minmax(350px,1.3fr) minmax(350px,1fr);gap:20px;padding:20px;max-width:1500px;margin:auto}section{background:#141d2a;border:1px solid #293344;border-radius:15px;padding:18px}h2{font-size:16px;margin:0 0 12px}p{color:#a4b2c7;margin:8px 0 16px}#scene{display:block;width:100%;height:620px;background:#0c1420;border-radius:10px}#source{display:block;width:min(100%,440px);height:auto;margin:auto;touch-action:none;border-radius:10px;cursor:crosshair}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:14px}label{display:block;color:#bcc9dc}input[type=range]{width:100%;accent-color:#81e0c5}output{float:right;color:#80ddc4;font-variant-numeric:tabular-nums}button,select{font:inherit;background:#23334a;border:1px solid #3d526d;color:#eaf2ff;border-radius:8px;padding:8px 12px}button{cursor:pointer}button:hover{background:#324866}.toolbar{display:flex;gap:9px;flex-wrap:wrap;margin:10px 0}.status{font-size:12px;color:#90a4bf}#json{width:100%;height:150px;font:11px/1.4 monospace;background:#101827;color:#a4d9cd;border:1px solid #34465e;border-radius:8px;padding:8px}details{margin-top:14px}#error{color:#ffb7b7;white-space:pre-wrap} @media(max-width:850px){main{grid-template-columns:1fr;padding:12px}header{padding:16px;display:block}#scene{height:540px}}
</style></head><body>
<header><h1>轻漾 · 结构与局部材料工作台</h1><span>S2 研究草稿 · 隐藏表面尚未通过配准</span><a href="parts-fit.html" style="color:#a6efba">部件调整工具 ↗</a></header>
<main><section><h2>表面、观察角度与支撑运动</h2><p>旋转相机检查背部材料如何被遮挡与显露。彩色区域仍缺少可信纹理；这里的推断结构不代表最终壁纸。</p>
<canvas id="scene" width="720" height="900" aria-label="可旋转的结构和背部材料"></canvas>
<div class="toolbar"><button id="front">主视角</button><button id="back">背部视角</button><button id="motion" aria-pressed="false">往返观察</button><select id="mode" aria-label="显示方式"><option value="photo">局部材料</option><option value="region">结构部位</option><option value="normal">几何法线</option><option value="depth">相机深度</option><option value="support">支撑范围</option></select><label><input id="observed" type="checkbox" checked> 主图与纸面拼接检查</label></div>
<label><input id="paperPartition" type="checkbox"> 纸边来源分区实验</label><label><input id="paperContact" type="checkbox"> 腿面接触候选</label><label><input id="paperTrim" type="checkbox"> 外缘去背景（旧候选）</label><label><input id="seatSupport" type="checkbox"> 坐姿支撑候选</label><label><input id="forearmVolume" type="checkbox"> 前臂分层厚度实验</label><label><input id="rear" type="checkbox" checked> 显示后表面（对照开关）</label><div class="controls"><label>相机左右 <output id="cameraValue">0°</output><input id="camera" type="range" min="-180" max="180" value="0"></label><label>相机俯仰 <output id="pitchValue">0°</output><input id="pitch" type="range" min="-25" max="25" value="0"></label><label>躯干偏转 <output id="bodyValue">0°</output><input id="body" type="range" min="-3.4" max="3.4" value="0" step=".1"></label><label>躯干侧倾 <output id="rollValue">0°</output><input id="roll" type="range" min="-2" max="2" value="0" step=".1"></label></div>
<div id="status" class="status" role="status">准备结构…</div><div id="error" role="alert"></div></section>
<section><h2>背部来源与局部配准</h2><p>拖动原图中的圆点调整局部取样范围。原图保持原样；草稿可恢复，但不会提高纹理可信度或修改手机壁纸。</p><canvas id="source" width="543" height="724" aria-label="原始背图与可拖动的局部配准点"></canvas><div class="toolbar"><button id="reset">恢复默认配准</button><button id="save">保存草稿</button><button id="restore">恢复已保存草稿</button></div><div id="draftStatus" class="status" role="status">纹理可信度：0 · 相机与肩颈接缝待校准</div><details><summary>当前配准草稿</summary><textarea id="json" readonly aria-label="配准草稿JSON"></textarea></details></section></main>
<script type="module" src="./structural-lab.mjs?paper=11a"></script></body></html>
