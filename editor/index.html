<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>轻漾 2.5D 角色编辑器</title>
<style>
  :root { --bg:#14161a; --panel:#1d2026; --panel2:#23272f; --line:#31363f; --text:#dfe3e8; --dim:#8b93a1; --accent:#4fd2ff; --warn:#ffd54a; --err:#ff6b6b; --ok:#7CFC00; }
  * { box-sizing: border-box; }
  body { margin:0; font:13px/1.5 "Segoe UI",system-ui,sans-serif; background:var(--bg); color:var(--text); height:100vh; display:flex; flex-direction:column; overflow:hidden; }
  header { display:flex; align-items:center; gap:8px; padding:8px 12px; background:var(--panel); border-bottom:1px solid var(--line); }
  header h1 { font-size:14px; margin:0 12px 0 0; color:var(--accent); white-space:nowrap; }
  header .spacer { flex:1; }
  button { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:6px; padding:5px 12px; cursor:pointer; font-size:12.5px; }
  button:hover:not(:disabled) { border-color:var(--accent); color:#fff; }
  button:disabled { opacity:.4; cursor:default; }
  button.active { background:var(--accent); color:#10222b; border-color:var(--accent); font-weight:600; }
  button.danger:hover:not(:disabled) { border-color:var(--err); }
  main { flex:1; display:grid; grid-template-columns: 220px 1fr 300px; min-height:0; }
  .col { background:var(--panel); overflow-y:auto; padding:10px; }
  .col.left { border-right:1px solid var(--line); }
  .col.right { border-left:1px solid var(--line); }
  .col h3 { margin:4px 0 8px; font-size:13px; color:var(--accent); }
  .col h4 { margin:14px 0 6px; font-size:12px; color:var(--dim); border-top:1px dashed var(--line); padding-top:10px; }
  .layer-row { display:flex; align-items:center; gap:6px; padding:5px 7px; border-radius:6px; cursor:pointer; margin-bottom:2px; }
  .layer-row:hover { background:var(--panel2); }
  .layer-row.selected { background:#2b3b46; outline:1px solid var(--accent); }
  .layer-row span { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #stageWrap { position:relative; background:#0d0e11; min-width:0; display:flex; flex-direction:column; }
  #stage { position:relative; flex:1; overflow:hidden; }
  #scene, #overlay { position:absolute; inset:0; width:100%; height:100%; }
  #overlay { pointer-events:none; }
  #transport { display:flex; gap:6px; align-items:center; padding:8px 12px; background:var(--panel); border-top:1px solid var(--line); flex-wrap:wrap; }
  #phase { color:var(--dim); margin-left:8px; }
  #phase.error { color:var(--err); }
  .toolbar { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:10px; }
  .prop-row { display:flex; align-items:center; gap:6px; margin:3px 0; }
  .prop-row span { flex:1; color:var(--dim); }
  .prop-row input[type=number] { width:90px; background:var(--panel2); border:1px solid var(--line); color:var(--text); border-radius:4px; padding:3px 6px; }
  .prop-row input[type=range] { flex:1.4; }
  .hint { color:var(--dim); font-size:12px; margin:4px 0; }
  details { margin:4px 0; border:1px solid var(--line); border-radius:6px; padding:4px 8px; }
  summary { cursor:pointer; color:var(--text); }
  #statusbar { padding:6px 12px; background:var(--panel); border-top:1px solid var(--line); color:var(--dim); white-space:pre-wrap; min-height:28px; max-height:64px; overflow-y:auto; }
  #statusbar[data-kind=warn] { color:var(--warn); }
  #statusbar[data-kind=error] { color:var(--err); }
  #stats { color:var(--dim); font-variant-numeric:tabular-nums; margin-left:auto; }
  #hoverInfo { color:var(--warn); }
  label.inline { display:flex; gap:6px; align-items:center; color:var(--dim); margin:4px 0; }
  .seg { display:flex; gap:4px; }
  #stats { font-size:12px; }
</style>
</head>
<body>
<header>
  <h1>轻漾 2.5D 角色编辑器</h1>
  <button id="openBtn">📂 打开工程</button>
  <button id="saveBtn">💾 保存工程</button>
  <button id="undoBtn" disabled>↩ 撤销</button>
  <button id="redoBtn" disabled>↪ 重做</button>
  <span id="histInfo" class="hint"></span>
  <span class="spacer"></span>
  <span id="hoverInfo"></span>
</header>
<main>
  <div class="col left">
    <h3>素材</h3>
    <label class="inline"><input type="checkbox" id="assetAsMask"> 作为蒙版导入</label>
    <input type="file" id="assetFile" accept=".png,.jpg,.jpeg,.webp" style="display:none">
    <button id="assetBtn" onclick="document.querySelector('#assetFile').click()">导入 PNG/JPG…</button>
    <h3>图层</h3>
    <div id="layerTree"></div>
    <h3>输入轨迹（B9）</h3>
    <button id="recBtn">⏺ 开始录制</button>
    <select id="trackSel" style="width:100%;margin:4px 0;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:4px;padding:4px"></select>
    <button id="playTrackBtn" style="width:100%">↻ 回放选中轨迹</button>
    <button id="fpsCmpBtn" style="width:100%;margin-top:4px">📊 30/60/120fps 对比</button>
    <h3>显示</h3>
    <label class="inline"><input type="checkbox" id="showMesh" checked> 网格与控制点</label>
    <label class="inline">编辑强度 <input type="range" id="editAmount" min="0" max="100" value="60" style="flex:1"> <span id="editAmountVal">0.60</span></label>
    <h3>蒙版工具</h3>
    <label class="inline">目标 <span class="seg"><select id="maskTarget"><option value="mask">蒙版多边形</option><option value="pin">接触固定区</option></select></span></label>
    <label class="inline">画笔半径 <input type="range" id="brushRadius" min="4" max="120" value="24" style="flex:1"> <span id="brushVal">24px</span></label>
  </div>
  <div id="stageWrap">
    <div id="stage">
      <canvas id="scene"></canvas>
      <canvas id="overlay"></canvas>
    </div>
    <div id="transport">
      <button data-tool="select" class="active">⬚ 选择/拖点</button>
      <button data-tool="maskPoly">⬠ 多边形</button>
      <button data-tool="maskBrush">✎ 蒙版画笔</button>
      <button data-tool="maskErase">⌫ 蒙版擦除</button>
      <span style="border-left:1px solid var(--line);height:20px"></span>
      <button id="playBtn">▶ 播放演示</button>
      <button id="stepBtn">⏭ 单步</button>
      <button id="resetBtn">⟲ 复位</button>
      <span id="phase">加载中…</span>
      <span id="stats"></span>
    </div>
  </div>
  <div class="col right"><div id="props"></div></div>
</main>
<div id="statusbar">正在初始化…</div>
<input type="file" id="projectFile" accept=".json" style="display:none">
<script type="module" src="./src/main.mjs"></script>
</body>
</html>
